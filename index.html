<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="stylesheet.css">
        <title>Calculadora de Lili Petalochispa</title> 

        <script src="animation.js" defer></script>

        <!--Fuente roboto-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>
    <body>
        <!--Título-->
        <header class = "title">
            <h1>⭐ CALCULADORA DE LILI PETALOCHISPA ❤️</h1>
        </header>
        <!--Contenedor general para estilizado-->
        <div class="contenedor">

            <!--Resultado-->
            <div class="resultado">
                <p id="display">0</p>
            </div>

            <!--Calculadora-->
            <div id="row1">
                <button class="calcItem operator" id="par1">(</button>
                <button class="calcItem operator" id="par2">)</button>
                <button class="calcItem operator" id="borr">⌫</button>
                <button class="calcItem operator" id="AC">AC</button>
                <button class="calcItem">7</button>
                <button class="calcItem">8</button>
                <button class="calcItem">9</button>
                <button class="calcItem operator" id="div">/</button>

                <button class="calcItem">4</button>
                <button class="calcItem">5</button>
                <button class="calcItem">6</button>
                <button class="calcItem operator" id="mult">*</button>

                <button class="calcItem">1</button>
                <button class="calcItem">2</button>
                <button class="calcItem">3</button>
                <button class="calcItem operator" id="rest">-</button>

                <button class="calcItem">0</button>
                <button class="calcItem operator" id="punto">.</button>
                <button class="calcItem operator" id="igual">=</button>
                <button class="calcItem operator" id="sum">+</button>
        </div>

        </div>
    </body>
</html>
